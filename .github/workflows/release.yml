name: Build & Release Riot Link

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Standalone Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --clean -y RiotLink.spec

      - name: Prepare Release Package & Checksums
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { "${{ github.event.inputs.version }}" }
          if (-not $tag) { $tag = "v1.0.0" }

          # Create distribution package folder
          $pkgDir = "dist/RiotLink-package"
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item -Path "dist/RiotLink.exe" -Destination "$pkgDir/"
          Copy-Item -Path "README.md" -Destination "$pkgDir/"

          # Create ZIP archive
          $zipName = "RiotLink-${tag}-windows-x64.zip"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "dist/$zipName" -Force

          # Generate SHA256 checksums
          $exeHash = (Get-FileHash -Path "dist/RiotLink.exe" -Algorithm SHA256).Hash
          $zipHash = (Get-FileHash -Path "dist/$zipName" -Algorithm SHA256).Hash

          $checksumContent = @"
          SHA256 Checksums for Riot Link $tag:
          $exeHash  RiotLink.exe
          $zipHash  $zipName
          "@

          Set-Content -Path "dist/checksums.txt" -Value $checksumContent
          Write-Output $checksumContent

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Riot Link ${{ github.ref_name || github.event.inputs.version || 'v1.0.0' }}"
          tag_name: ${{ github.ref_name || github.event.inputs.version || 'v1.0.0' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/RiotLink.exe
            dist/RiotLink-*-windows-x64.zip
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
